name = "digipagosio"
main = "src/index.js"
compatibility_date = "2026-09-15"

# KV namespace for storing customer/transaction records.
kv_namespaces = [
  { binding = "DIGIPAGOS_CUSTOMERS", id = "eafcd6e1b8a3433a9d2bede7da868230" }
]

# Static assets: serves everything in ./public. The Worker runs first for
# /api/* and for the site root (/), which redirects to signup or dashboard.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/"]

# Keep Workers Logs enabled (needed to see Noah webhook events).
[observability]
enabled = true

# Secrets (set via the Cloudflare dashboard or `wrangler secret put <NAME>`,
# do NOT put real values here):
#   NOAH_API_KEY
#   AUTH_SECRET
#
# This is the SANDBOX webhook key. Swap for the production key from
# https://docs.noah.com/api-concepts/webhooks/configuration before
# going live.
[vars]
NOAH_API_BASE = "https://api.sandbox.noah.com/v1"
NOAH_WEBHOOK_PUBLIC_KEY = """
-----BEGIN PUBLIC KEY-----
MHYwEAYHKoZIzj0CAQYFK4EEACIDYgAEm8yBiD+kmVJ1Xc9sfRkDx0yo9+u8yiAD
PngI20KoEswz0gflp8o/z66Abqz/m9A1CBecixWdeT72pA8NZBJI6L6Osd8RV+yx
QArxeGKEVX/2QNrfPqeAKODHT5LdStGT
-----END PUBLIC KEY-----
"""
