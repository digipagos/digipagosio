<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | DigiPagos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0a1f3d;
  --ink-2: #123159;
  --cyan: #0ea5c6;
  --cyan-soft: #e3f6fa;
  --bg: #f3f6f9;
  --panel: #ffffff;
  --line: #dde5ed;
  --text: #14263d;
  --muted: #5a6b80;
  --ok: #0b8a5f;
  --ok-bg: #e2f5ec;
  --warn: #8f5c05;
  --warn-bg: #fdf1da;
  --bad: #b42318;
  --bad-bg: #fde8e6;
  --r: 6px;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 400 15px/1.5 var(--sans); color: var(--text); background: var(--bg); }
a { color: var(--ink-2); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
.side { background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
.brand { padding: 4px 10px 24px; }
.brand img { height: 34px; width: auto; display: block; max-width: 100%; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: var(--r); color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--bg); color: var(--text); }
.nav a[aria-current="page"] { background: var(--cyan-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--cyan); }
.nav svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.side-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.side-foot .who { color: var(--text); font-weight: 500; word-break: break-all; margin-bottom: 8px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; cursor: pointer; }

.topbar { display: none; }
.main { padding: 28px 36px 64px; max-width: 1140px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
h1 { font-size: 24px; line-height: 1.25; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- pieces ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 18px; }
.panel-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.panel-b { padding: 18px; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 13.5px; word-break: break-all; }

.badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.b-ok { background: var(--ok-bg); color: var(--ok); }
.b-warn { background: var(--warn-bg); color: var(--warn); }
.b-bad { background: var(--bad-bg); color: var(--bad); }
.b-neutral { background: #eaf0f6; color: var(--muted); }

.btn { border-radius: var(--r); padding: 9px 16px; border: 1px solid transparent; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; line-height: 1.3; }
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover { background: var(--ink-2); }
.btn-ghost { background: #fff; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: var(--cyan); }
.btn[disabled] { opacity: 0.55; cursor: progress; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

.note { border-left: 3px solid var(--cyan); background: var(--cyan-soft); padding: 11px 14px; border-radius: 0 var(--r) var(--r) 0; color: var(--ink); font-size: 14px; margin-bottom: 18px; }
.note.warn { border-color: #e0a526; background: var(--warn-bg); color: #4d3402; }
.note.bad { border-color: var(--bad); background: var(--bad-bg); color: #5c120c; }
.note .actions { margin-top: 10px; }

/* funds-flow strip */
.flow { background: var(--ink); color: #fff; border-radius: var(--r); padding: 22px 26px; margin-bottom: 18px; }
.flow-track { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; }
.node .t { font-weight: 600; }
.node .n { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; margin: 6px 0 2px; }
.node .s { color: #9fb3cc; font-size: 13px; }
.link { width: clamp(40px, 8vw, 110px); height: 2px; margin: 0 14px; background: repeating-linear-gradient(90deg, #3b5b85 0 6px, transparent 6px 12px); background-size: 12px 2px; }
.link.active { background-image: repeating-linear-gradient(90deg, var(--cyan) 0 6px, transparent 6px 12px); animation: dash 1s linear infinite; }
@keyframes dash { to { background-position: 12px 0; } }
@media (prefers-reduced-motion: reduce) { .link.active { animation: none; } }
.flow-note { margin: 18px 0 0; color: #b8c8dc; font-size: 13px; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 18px; }
.stat { padding: 16px 18px; border-right: 1px solid var(--line); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat .n { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .l { color: var(--muted); font-size: 13px; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 10px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 18px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.detail td { padding-top: 0; color: var(--muted); font-size: 13px; }
.empty { padding: 34px 18px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--text); margin-bottom: 4px; }

/* forms */
.field { margin-bottom: 14px; }
label { display: block; font-weight: 500; margin-bottom: 5px; font-size: 14px; }
input, select { width: 100%; border: 1px solid #c5d1de; background: #fff; border-radius: var(--r); padding: 9px 11px; }
input:focus, select:focus { border-color: var(--cyan); }
.hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-narrow { max-width: 520px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }

/* key/value */
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 9px 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy { border: 1px solid var(--line); background: #fff; border-radius: 4px; font-size: 12px; padding: 1px 8px; cursor: pointer; color: var(--ink-2); }
.copy:hover { border-color: var(--cyan); }
.rail { font-weight: 600; margin: 0 0 10px; }
.sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.sim { display: flex; gap: 8px; align-items: flex-end; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.sim .field { margin: 0; width: 130px; }

.linkbox { display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; margin: 10px 0; }
.linkbox .mono { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; word-break: normal; }

.toast { position: fixed; right: 20px; bottom: 20px; z-index: 50; background: var(--ink); color: #fff; padding: 11px 16px; border-radius: var(--r); max-width: 360px; opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.toast.err { background: var(--bad); }

.loading { padding: 30px 4px; color: var(--muted); }
.kyc-frame { width: 100%; height: 720px; border: 1px solid var(--line); border-radius: var(--r); background: #fff; }
.modal-wrap { position: fixed; inset: 0; z-index: 60; background: #fff; display: flex; flex-direction: column; }
.modal-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--ink); color: #fff; font-weight: 500; }
.modal-bar .btn-ghost { background: transparent; border-color: rgba(255,255,255,0.4); color: #fff; }
.modal-frame { flex: 1; width: 100%; border: 0; }
.foot { margin-top: 30px; color: var(--muted); font-size: 12.5px; max-width: 80ch; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .shell { display: block; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .topbar img { height: 28px; width: auto; }
  .topbar button { background: none; border: 1px solid var(--line); border-radius: var(--r); padding: 6px 12px; cursor: pointer; font-weight: 500; }
  .side { position: fixed; z-index: 30; inset: 0 auto 0 0; width: 260px; transform: translateX(-100%); transition: transform 0.2s; }
  .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(10, 31, 61, 0.4); }
  .main { padding: 20px 16px 56px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat:nth-child(2) { border-right: 0; }
  .stat:nth-child(-n + 2) { border-bottom: 1px solid var(--line); }
  .two-col, .row2 { grid-template-columns: 1fr; }
  .flow-track { grid-template-columns: 1fr; }
  .link { width: 2px; height: 26px; margin: 12px 0 12px 14px; background: repeating-linear-gradient(180deg, #3b5b85 0 6px, transparent 6px 12px); background-size: 2px 12px; }
  .link.active { background-image: repeating-linear-gradient(180deg, var(--cyan) 0 6px, transparent 6px 12px); }
  @keyframes dash { to { background-position: 0 12px; } }
  .kv { grid-template-columns: 1fr; gap: 2px 0; }
  .kv dd { margin-bottom: 8px; }
  .kyc-frame { height: 640px; }
}
</style>
</head>
<body>

<div class="topbar">
  <img src="/assets/logo.png" alt="DigiPagos">
  <button id="menu-btn" type="button" aria-expanded="false" aria-controls="side">Menu</button>
</div>

<div class="shell">
  <aside class="side" id="side" aria-label="Main">
    <div class="brand"><img src="/assets/logo.png" alt="DigiPagos"></div>
    <nav class="nav" id="nav">
      <a href="#overview" data-route="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1"/></svg>
        Overview
      </a>
      <a href="#payments" data-route="payments">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
        Receive payments
      </a>
      <a href="#banking" data-route="banking">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20.5h18"/></svg>
        Bank transfers
      </a>
      <a href="#withdrawals" data-route="withdrawals">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V9M7 13l5-5 5 5M5 4h14"/></svg>
        Withdrawals
      </a>
      <a href="#transactions" data-route="transactions">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Transactions
      </a>
      <a href="#verification" data-route="verification">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
        Verification
      </a>
    </nav>
    <div class="side-foot">
      <div class="who" id="who">&nbsp;</div>
      <button class="linkbtn" id="logout" type="button">Log out</button>
    </div>
  </aside>

  <main class="main" id="main" tabindex="-1">
    <div id="view"></div>
    <p class="foot" id="disclaimer"></p>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ---------- helpers ---------- */
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var state = { me: null, kyc: null, sandbox: false };

  function api(path, opts) {
    opts = opts || {};
    var init = { method: opts.method || "GET", credentials: "same-origin", headers: {} };
    if (opts.body !== undefined) {
      init.headers["Content-Type"] = "application/json";
      init.body = JSON.stringify(opts.body);
    }
    return fetch(path, init).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (res.status === 401) {
          window.location.href = "/login.html";
          throw new Error("Session expired");
        }
        if (!res.ok) {
          var msg = (data && (data.message || (data.details && (data.details.Detail || data.details.message)) || data.error)) || "Request failed";
          var err = new Error(msg);
          err.status = res.status;
          err.data = data;
          throw err;
        }
        return data;
      });
    });
  }

  function fmtAmount(a, cur) {
    var n = Number(a);
    if (!isFinite(n)) return "-";
    if (!cur || cur === "USD") {
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n);
    }
    return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + cur;
  }
  function fmtMulti(map) {
    var keys = Object.keys(map || {}).filter(function (k) { return map[k] !== 0; });
    if (!keys.length) return fmtAmount(0, "USD");
    return keys.map(function (k) { return fmtAmount(map[k], k); }).join(", ");
  }
  function fmtDate(v) {
    var d = new Date(v);
    if (isNaN(d)) return "-";
    return d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }
  function findUrl(o) {
    if (!o || typeof o !== "object") return null;
    var k, v;
    for (k in o) { v = o[k]; if (typeof v === "string" && /^https?:\/\//.test(v) && /url|link/i.test(k)) return v; }
    for (k in o) { v = o[k]; if (v && typeof v === "object") { var u = findUrl(v); if (u) return u; } }
    for (k in o) { v = o[k]; if (typeof v === "string" && /^https?:\/\//.test(v)) return v; }
    return null;
  }
  function short(s, n) {
    s = String(s || "");
    return s.length > (n || 14) ? s.slice(0, 6) + "..." + s.slice(-6) : s;
  }

  var toastTimer;
  function toast(msg, isErr) {
    var t = $("#toast");
    t.textContent = msg;
    t.className = "toast show" + (isErr ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = "toast"; }, 4200);
  }
  function copyText(text) {
    var done = function () { toast("Copied"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { toast("Could not copy", true); });
    } else {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast("Could not copy", true); }
      document.body.removeChild(ta);
    }
  }

  /* ---------- status logic ---------- */
  function statusOf(t) { return String(t.status || t.Status || "").toLowerCase(); }
  function isSettled(t) { var s = statusOf(t); return s === "settled" || s === "completed"; }
  function isFailed(t) { return /fail|reject|cancel|declin|expire|refund/.test(statusOf(t)); }
  function isPending(t) { return !isSettled(t) && !isFailed(t); }
  function badgeFor(t) {
    var label = t.status || t.Status || "Unknown";
    var cls = isSettled(t) ? "b-ok" : isFailed(t) ? "b-bad" : "b-warn";
    return '<span class="badge ' + cls + '">' + esc(label) + "</span>";
  }
  function typeLabel(t) {
    if (t.kind === "bank-deposit") return "Bank deposit";
    if (t.direction === "in") return "Payment received";
    if (t.direction === "out") return "Withdrawal";
    return t.noahData && t.noahData.Type ? String(t.noahData.Type) : "Network activity";
  }
  function amountOf(t) {
    var nd = t.noahData || {};
    var a = t.amount != null ? t.amount : (nd.FiatAmount != null ? nd.FiatAmount : nd.CryptoAmount);
    var c = t.currency || nd.FiatCurrency || nd.CryptoCurrency || "USD";
    return { a: a, c: c };
  }
  function kycInfo(status) {
    var s = String(status || "NotStarted");
    var low = s.toLowerCase();
    if (low === "approved" || low === "verified") return { label: "Verified", cls: "b-ok", ok: true };
    if (low === "pending" || low === "inreview" || low === "underreview") return { label: "In review", cls: "b-warn", ok: false };
    if (low === "notstarted") return { label: "Not started", cls: "b-neutral", ok: false };
    return { label: s, cls: "b-bad", ok: false };
  }

  /* ---------- data loaders ---------- */
  function loadKyc() {
    return api("/api/noah/customer-status").then(function (d) {
      state.kyc = (d.customer && d.customer.verificationStatus) || "Unknown";
    }, function (e) {
      if (e.status === 404) state.kyc = "NotStarted"; else throw e;
    }).then(function () { paintKycPill(); return state.kyc; });
  }
  function paintKycPill() {
    var k = kycInfo(state.kyc);
    var el = $("#kyc-pill");
    if (el) { el.className = "badge " + k.cls; el.textContent = "Identity: " + k.label; }
  }
  function loadTx() { return api("/api/noah/transactions").then(function (d) { return d.transactions || []; }); }
  function loadBalance() { return api("/api/noah/balance"); }

  /* ---------- view scaffolding ---------- */
  function head(title, sub) {
    return '<div class="page-head"><div><h1>' + esc(title) + "</h1>" +
      (sub ? '<p class="sub">' + esc(sub) + "</p>" : "") + '</div>' +
      '<div class="pills"><span class="badge b-warn" id="env-pill" style="display:' + (state.sandbox ? "inline-block" : "none") + '">Sandbox</span>' +
      '<span class="badge b-neutral" id="kyc-pill">Identity: ...</span></div></div>';
  }
  function view(html) { $("#view").innerHTML = html; paintKycPill(); }
  function loadingView(title, sub) { view(head(title, sub) + '<div class="loading">Loading...</div>'); }
  function errorView(title, e) {
    view(head(title, "") + '<div class="note bad">' + esc(e.message || "Something went wrong.") +
      ' <div class="actions"><button class="btn btn-ghost" type="button" data-act="reload">Try again</button></div></div>');
  }
  function kycBanner() {
    if (kycInfo(state.kyc).ok) return "";
    return '<div class="note warn">Verify your identity to start accepting payments, opening bank accounts and withdrawing. ' +
      '<div class="actions"><a class="btn btn-primary" href="#verification">Verify identity</a></div></div>';
  }

  function txTable(rows, withDetail) {
    if (!rows.length) {
      return '<div class="empty"><strong>No transactions yet</strong>Payments, bank deposits and withdrawals will show up here as soon as Noah reports them.</div>';
    }
    var out = '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Type</th><th class="num">Amount</th><th>Status</th><th>Reference</th></tr></thead><tbody>';
    rows.forEach(function (t) {
      var am = amountOf(t);
      var sign = t.direction === "out" ? "-" : "";
      out += "<tr><td>" + esc(fmtDate(t.createdAt || t.CreatedAt || t.updatedAt)) + "</td>" +
        "<td>" + esc(typeLabel(t)) + "</td>" +
        '<td class="num">' + esc(sign + fmtAmount(am.a, am.c)) + "</td>" +
        "<td>" + badgeFor(t) + "</td>" +
        '<td class="mono">' + esc(short(t.externalId || t.transactionId || "", 16)) + "</td></tr>";
      if (withDetail) {
        var bits = [];
        if (t.sender) bits.push("From " + t.sender);
        if (t.paymentMethodType) bits.push("via " + String(t.paymentMethodType).replace(/^Bank/, ""));
        if (t.subStatus) bits.push("Screening: " + t.subStatus);
        if (t.rfiStatus === "AwaitingCustomer") bits.push("Noah needs more information. Check the email address on your account.");
        if (bits.length) out += '<tr class="detail"><td></td><td colspan="4">' + esc(bits.join(". ")) + "</td></tr>";
      }
    });
    return out + "</tbody></table></div>";
  }

  /* ---------- views ---------- */
  function overview() {
    var T = "Overview", S = "Money in, money out and what is still moving.";
    loadingView(T, S);
    Promise.all([loadTx(), loadBalance(), loadKyc()]).then(function (r) {
      var tx = r[0], bal = r[1];
      var inbound = tx.filter(function (t) { return t.direction === "in"; });
      var pendingIn = inbound.filter(isPending);
      var settledIn = {};
      inbound.filter(isSettled).forEach(function (t) {
        var am = amountOf(t);
        if (isFinite(Number(am.a))) settledIn[am.c] = (settledIn[am.c] || 0) + Number(am.a);
      });
      var depositsSettled = {};
      tx.filter(function (t) { return t.kind === "bank-deposit" && isSettled(t); }).forEach(function (t) {
        var am = amountOf(t);
        if (isFinite(Number(am.a))) depositsSettled[am.c] = (depositsSettled[am.c] || 0) + Number(am.a);
      });
      var received = {};
      inbound.filter(function (t) { return isSettled(t) && t.kind !== "bank-deposit"; }).forEach(function (t) {
        var am = amountOf(t);
        if (isFinite(Number(am.a))) received[am.c] = (received[am.c] || 0) + Number(am.a);
      });

      var html = head(T, S) + kycBanner();
      html += '<section class="flow" aria-label="How your money moves">' +
        '<div class="flow-track">' +
        '<div class="node"><div class="t">Payer</div><div class="n">' + inbound.length + '</div><div class="s">payments and deposits started</div></div>' +
        '<div class="link' + (pendingIn.length ? " active" : "") + '" aria-hidden="true"></div>' +
        '<div class="node"><div class="t">Noah</div><div class="n">' + pendingIn.length + '</div><div class="s">in progress at the licensed processor</div></div>' +
        '<div class="link' + (pendingIn.length ? " active" : "") + '" aria-hidden="true"></div>' +
        '<div class="node"><div class="t">You</div><div class="n">' + esc(fmtMulti(settledIn)) + '</div><div class="s">settled to you</div></div>' +
        "</div>" +
        '<p class="flow-note">Funds go from the payer to Noah and then to you. DigiPagos never holds them.</p></section>';

      html += '<div class="stats">' +
        '<div class="stat"><div class="n">' + esc(fmtAmount(bal.estimatedBalance || 0, "USD")) + '</div><div class="l">Estimated balance</div></div>' +
        '<div class="stat"><div class="n">' + esc(fmtMulti(received)) + '</div><div class="l">Payments received</div></div>' +
        '<div class="stat"><div class="n">' + esc(fmtMulti(depositsSettled)) + '</div><div class="l">Bank deposits settled</div></div>' +
        '<div class="stat"><div class="n">' + pendingIn.length + '</div><div class="l">Waiting on Noah</div></div>' +
        "</div>";

      html += '<div class="actions" style="margin-bottom:18px">' +
        '<a class="btn btn-primary" href="#payments">Create payment link</a>' +
        '<a class="btn btn-ghost" href="#banking">Open a bank account</a>' +
        '<a class="btn btn-ghost" href="#withdrawals">Withdraw</a></div>';

      html += '<section class="panel"><div class="panel-h"><h2>Recent activity</h2><a href="#transactions">View all</a></div>' +
        txTable(tx.slice(0, 6), false) + "</section>";
      view(html);
    }).catch(function (e) { errorView(T, e); });
  }

  var quoteDebounce;
  function refreshQuote(method, cur, amount) {
    var slot = $("#p-quote");
    if (!slot) return;
    if (!(amount > 0)) { slot.innerHTML = ""; return; }
    clearTimeout(quoteDebounce);
    slot.innerHTML = '<p class="hint">Getting live rate...</p>';
    quoteDebounce = setTimeout(function () {
      var params;
      if (method === "fiat") {
        params = "source=" + encodeURIComponent(cur) + "&destination=USDC_TEST&sourceAmount=" + encodeURIComponent(amount);
      } else {
        params = "source=" + encodeURIComponent(cur) + "&destination=USD&sourceAmount=" + encodeURIComponent(amount);
      }
      api("/api/noah/price?" + params).then(function (d) {
        var it = (d.quote && d.quote.Items && d.quote.Items[0]) || null;
        if (!it) { slot.innerHTML = ""; return; }
        if (method === "fiat") {
          slot.innerHTML = '<p class="hint">Customer pays ' + esc(fmtAmount(amount, cur)) +
            " &rarr; you receive about " + esc(Number(it.DestinationAmount).toFixed(6)) + " USDC" +
            (it.TotalFee ? " (fee " + esc(fmtAmount(it.TotalFee, cur)) + ")" : "") + ".</p>";
        } else {
          slot.innerHTML = '<p class="hint">' + esc(amount) + " USDC &rarr; customer sees about " +
            esc(fmtAmount(it.DestinationAmount, "USD")) + ".</p>";
        }
      }).catch(function () { slot.innerHTML = ""; });
    }, 450);
  }

  function pollPaymentStatus(container, transactionId) {
    if (!transactionId) return;
    var tries = 0;
    (function poll() {
      if (tries++ > 10) return;
      api("/api/noah/transaction/" + encodeURIComponent(transactionId)).then(function (d) {
        var t = d.transaction || {};
        var line = $(".status-line", container);
        if (line) line.innerHTML = "Status: " + badgeFor(t);
        if (isPending(t)) setTimeout(poll, 4000);
      }).catch(function () { /* keep last known state */ });
    })();
  }

  function vaCard(v) {

        " and sent to <span class=\"mono\">" + esc(short(dest.destinationAddress, 14)) + "</span>.</p>";
    }
    pms.forEach(function (pm, i) {
      var d = pm.DisplayDetails || {};
      var rail = String(pm.ID || "").split("/")[1] || pm.PaymentMethodCategory || "Bank";
      var ah = pm.AccountHolderDetails || {};
      var holder = ah.BusinessName || [ah.Name && ah.Name.FirstName, ah.Name && ah.Name.LastName].filter(Boolean).join(" ");
      var a = d.BankAddress || {};
      var addr = [a.Street, a.City, a.State, a.PostCode, a.Country].filter(Boolean).join(", ");
      var routing = d.BankCode || d.RoutingNumber;
      if (i) html += '<hr class="sep">';
      html += '<p class="rail">' + esc(rail) + "</p><dl class=\"kv\">";
      if (holder) html += "<dt>Account holder</dt><dd>" + esc(holder) + "</dd>";
      if (d.BankName) html += "<dt>Bank</dt><dd>" + esc(d.BankName) + "</dd>";
      if (d.AccountNumber) html += "<dt>Account number</dt><dd><span class=\"mono\">" + esc(d.AccountNumber) + '</span><button class="copy" type="button" data-copy="' + esc(d.AccountNumber) + '">Copy</button></dd>';
      if (routing) html += "<dt>Routing number</dt><dd><span class=\"mono\">" + esc(routing) + '</span><button class="copy" type="button" data-copy="' + esc(routing) + '">Copy</button></dd>';
      if (d.SwiftCode) html += "<dt>SWIFT</dt><dd><span class=\"mono\">" + esc(d.SwiftCode) + "</span></dd>";
      if (addr) html += "<dt>Bank address</dt><dd>" + esc(addr) + "</dd>";
      html += "</dl>";
    });
    var firstBank = pms.filter(function (p) { return p.PaymentMethodCategory === "Bank"; })[0] || pms[0];

    }
    return html + "</div></section>";

  function transactions() {
    var T = "Transactions", S = "Everything Noah has reported for your account.";
    loadingView(T, S);
    Promise.all([loadKyc(), loadTx()]).then(function (r) {
      var all = r[1];
      view(head(T, S) +
        '<section class="panel"><div class="panel-h"><h2>Activity</h2><div class="actions">' +
        '<select id="f-type" aria-label="Type" style="width:auto"><option value="">All types</option><option value="in">Received</option><option value="out">Withdrawals</option><option value="dep">Bank deposits</option></select>' +

        '<button class="btn btn-ghost" type="button" id="f-refresh">Refresh</button></div></div><div id="tx-body"></div></section>');
      function paint() {
        var ft = $("#f-type").value, fs = $("#f-status").value;
        var rows = all.filter(function (t) {
          if (ft === "in" && !(t.direction === "in" && t.kind !== "bank-deposit")) return false;
          if (ft === "out" && t.direction !== "out") return false;
          if (ft === "dep" && t.kind !== "bank-deposit") return false;
          if (fs === "settled" && !isSettled(t)) return false;
          if (fs === "pending" && !isPending(t)) return false;
          if (fs === "failed" && !isFailed(t)) return false;
          return true;
        });
        $("#tx-body").innerHTML = txTable(rows, true);
      }
      paint();
      $("#f-type").addEventListener("change", paint);
      $("#f-status").addEventListener("change", paint);
      $("#f-refresh").addEventListener("click", transactions);
    }).catch(function (e) { errorView(T, e); });

  /* ---------- router ---------- */
  var routes = { overview: overview, payments: payments, banking: banking, withdrawals: withdrawals, transactions: transactions, verification: function () { verification({ autostart: window.location.hash.indexOf("verification?start") !== -1 }); } };
  var titles = { overview: "Overview", payments: "Receive payments", banking: "Bank transfers", withdrawals: "Withdrawals", transactions: "Transactions", verification: "Verification" };
  var current = "overview";

  function route() {
    var raw = (window.location.hash || "#overview").slice(1);
    var key = raw.split("?")[0];
    if (!routes[key]) key = "overview";
    current = key;
    var links = document.querySelectorAll("#nav a");
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute("data-route") === key) links[i].setAttribute("aria-current", "page");
      else links[i].removeAttribute("aria-current");
    }
    document.title = titles[key] + " | DigiPagos";
    closeMenu();
    routes[key]();
    window.scrollTo(0, 0);
  }

  function closeMenu() {
    $("#side").classList.remove("open");
    $("#menu-btn").setAttribute("aria-expanded", "false");
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var c = t.closest("[data-copy]");
    if (c) { copyText(c.getAttribute("data-copy")); return; }
    if (t.closest("[data-act='reload']")) { routes[current](); return; }
    var sim = t.closest("[data-sim-pm]");
    if (sim) {
      var amt = Number(sim.parentNode.querySelector("[data-sim-amount]").value);
      if (!(amt > 0)) { toast("Enter a test amount", true); return; }
      sim.disabled = true;
      api("/api/noah/simulate-deposit", { method: "POST", body: { paymentMethodId: sim.getAttribute("data-sim-pm"), amount: amt } })
        .then(function () { toast("Test deposit sent. It shows in Transactions in a few seconds."); })
        .catch(function (e) { toast(e.message, true); })
        .then(function () { sim.disabled = false; });
    }
  });

  $("#menu-btn").addEventListener("click", function () {
    var open = $("#side").classList.toggle("open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  $("#logout").addEventListener("click", function () {
    api("/api/auth/logout", { method: "POST" }).catch(function () {}).then(function () { window.location.href = "/login.html"; });
  });
  window.addEventListener("hashchange", route);

  /* ---------- boot ---------- */
  api("/api/auth/me").then(function (me) {
    state.me = me;
    state.sandbox = !!me.sandbox;
    $("#who").textContent = me.email;
    $("#disclaimer").textContent = me.disclaimer || "";
    route();
  }).catch(function () { /* 401 already redirected */ });
})();
</script>
</body>
</html>
