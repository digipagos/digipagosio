<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In | DigiPagos</title>
<style>
  :root { --cyan:#00ADDE; --black:#0A0A0A; --gray:#5A5A5A; --light-gray:#F4F7F9; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--light-gray); color:var(--black); }
  header { background:var(--black); padding:18px 24px; display:flex; align-items:center; }
  header img { height:32px; }
  main { max-width:400px; margin:60px auto; padding:0 20px; }
  h1 { font-size:1.3rem; margin-bottom:20px; text-align:center; }
  .card { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,0.08); padding:30px; }
  label { display:block; font-size:0.85rem; color:var(--gray); margin-bottom:6px; }
  input { width:100%; padding:10px 12px; border:1px solid #D5DCE1; border-radius:6px; font-size:1rem; margin-bottom:16px; }
  button { width:100%; padding:12px; background:var(--black); color:#fff; border:none; border-radius:6px; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:0.6; cursor:default; }
  #error-msg { color:#C0392B; font-size:0.85rem; margin-bottom:12px; display:none; }
  .switch-link { text-align:center; margin-top:16px; font-size:0.9rem; }
  .switch-link a { color:var(--cyan); text-decoration:none; }
  footer { text-align:center; color:#B7C1CA; font-size:0.75rem; padding:30px 0; }
</style>
</head>
<body>

<header><img src="/assets/logo.png" alt="DigiPagos" /></header>

<main>
  <h1>Log in to your account</h1>
  <div class="card">
    <p id="error-msg"></p>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required />
      <label for="password">Password</label>
      <input type="password" id="password" required />
      <button type="submit" id="submit-btn">Log in</button>
    </form>
    <p class="switch-link">Don't have an account? <a href="/signup.html">Create one</a></p>
  </div>
</main>

<footer>DigiPagos — Fast. Secure. Borderless.</footer>

<script>
  const form = document.getElementById("login-form");
  const errorMsg = document.getElementById("error-msg");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = "Invalid email or password.";
        errorMsg.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
        return;
      }

      window.location.href = "/dashboard.html";
    } catch (err) {
      errorMsg.textContent = "Network error. Please try again.";
      errorMsg.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Log in";
    }
  });
</script>

</body>
</html>
