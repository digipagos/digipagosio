<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard | DigiPagos</title>
<style>
  :root { --cyan:#00ADDE; --black:#0A0A0A; --gray:#5A5A5A; --light-gray:#F4F7F9; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--light-gray); color:var(--black); }
  header { background:var(--black); padding:18px 24px; display:flex; align-items:center; justify-content:space-between; }
  header img { height:32px; }
  header button { background:none; border:1px solid #444; color:#fff; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:0.85rem; }
  main { max-width:640px; margin:32px auto; padding:0 20px; }
  h1 { font-size:1.2rem; margin:0 0 4px; }
  p.subtitle { color:var(--gray); margin-top:0; }
  .card { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,0.08); padding:24px; margin-bottom:20px; }
  label { display:block; font-size:0.85rem; color:var(--gray); margin-bottom:6px; }
  input, select { width:100%; padding:10px 12px; border:1px solid #D5DCE1; border-radius:6px; font-size:1rem; margin-bottom:16px; }
  button.primary { padding:12px 20px; background:var(--black); color:#fff; border:none; border-radius:6px; font-size:1rem; cursor:pointer; }
  button.primary:disabled { opacity:0.6; cursor:default; }
  #payment-result { margin-top:12px; padding:14px; background:var(--light-gray); border-radius:8px; font-size:0.9rem; word-break:break-all; display:none; }
  #payment-result a { color:var(--cyan); }
  table { width:100%; border-collapse:collapse; font-size:0.85rem; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #EEF1F3; }
  #empty-tx { color:var(--gray); font-size:0.9rem; }
  #error-msg { color:#C0392B; font-size:0.85rem; margin-bottom:12px; display:none; }
  footer { text-align:center; color:#B7C1CA; font-size:0.75rem; padding:30px 0; }
</style>
</head>
<body>

<header>
  <img src="/assets/logo.png" alt="DigiPagos" />
  <button id="logout-btn">Log out</button>
</header>

<main>
  <h1 id="welcome">Dashboard</h1>
  <p class="subtitle" id="verification-note"></p>

  <div class="card">
    <h2 style="font-size:1rem; margin-top:0;">Request a payment</h2>
    <p id="error-msg"></p>
    <form id="payment-form">
      <label for="amount">Amount (USD)</label>
      <input type="number" id="amount" min="1" step="0.01" required />
      <button type="submit" class="primary" id="pay-btn">Create payment link</button>
    </form>
    <div id="payment-result"></div>
  </div>

  <div class="card">
    <h2 style="font-size:1rem; margin-top:0;">Transaction history</h2>
    <div id="tx-container">
      <p id="empty-tx">No transactions yet.</p>
    </div>
  </div>
</main>

<footer>DigiPagos — Fast. Secure. Borderless.</footer>

<script>
  async function checkAuth() {
    const res = await fetch("/api/auth/me", { credentials: "include" });
    if (!res.ok) {
      window.location.href = "/login.html";
      return null;
    }
    const data = await res.json();
    document.getElementById("welcome").textContent = "Welcome, " + data.email;
    return data.email;
  }

  async function loadTransactions() {
    const res = await fetch("/api/noah/transactions", { credentials: "include" });
    if (!res.ok) return;
    const data = await res.json();
    const container = document.getElementById("tx-container");
    const empty = document.getElementById("empty-tx");

    if (!data.transactions || data.transactions.length === 0) {
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    const table = document.createElement("table");
    table.innerHTML = "<tr><th>Date</th><th>Amount</th><th>Status</th></tr>";
    data.transactions.forEach((tx) => {
      const row = document.createElement("tr");
      row.innerHTML =
        "<td>" + (tx.Created || tx.CreatedAt || "-") + "</td>" +
        "<td>" + (tx.FiatAmount || tx.Amount || "-") + "</td>" +
        "<td>" + (tx.Status || "-") + "</td>";
      table.appendChild(row);
    });
    container.innerHTML = "";
    container.appendChild(table);
  }

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
    window.location.href = "/login.html";
  });

  const paymentForm = document.getElementById("payment-form");
  const errorMsg = document.getElementById("error-msg");
  const payBtn = document.getElementById("pay-btn");
  const resultBox = document.getElementById("payment-result");

  paymentForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.style.display = "none";
    resultBox.style.display = "none";
    payBtn.disabled = true;
    payBtn.textContent = "Creating...";

    const amount = document.getElementById("amount").value;

    try {
      const res = await fetch("/api/noah/create-payment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ amount }),
      });
      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = "Couldn't create the payment link. " + (data.message || "");
        errorMsg.style.display = "block";
        payBtn.disabled = false;
        payBtn.textContent = "Create payment link";
        return;
      }

      // NOTE: confirm the exact field Noah returns for the checkout URL
      // (Url / CheckoutUrl / HostedURL) once tested — same pattern as
      // the onboarding flow.
      const checkoutUrl =
        data.checkout.Url || data.checkout.CheckoutUrl || data.checkout.HostedURL;

      resultBox.style.display = "block";
      resultBox.innerHTML = checkoutUrl
        ? "Share this link with your customer: <br><a href='" + checkoutUrl + "' target='_blank'>" + checkoutUrl + "</a>"
        : "Payment created, but no checkout link was found. Raw response: " + JSON.stringify(data.checkout);

      paymentForm.reset();
      loadTransactions();
    } catch (err) {
      errorMsg.textContent = "Network error. Please try again.";
      errorMsg.style.display = "block";
    } finally {
      payBtn.disabled = false;
      payBtn.textContent = "Create payment link";
    }
  });

  (async () => {
    const email = await checkAuth();
    if (email) loadTransactions();
  })();
</script>

</body>
</html>
