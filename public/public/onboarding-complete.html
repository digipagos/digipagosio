<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verification Complete | DigiPagos</title>
<style>
  :root {
    --cyan: #00ADDE;
    --black: #0A0A0A;
    --gray: #5A5A5A;
    --light-gray: #F4F7F9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--light-gray);
    color: var(--black);
  }
  header {
    background: var(--black);
    padding: 18px 24px;
    display: flex;
    align-items: center;
  }
  header img { height: 32px; }
  main {
    max-width: 480px;
    margin: 60px auto;
    padding: 0 20px;
    text-align: center;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 40px 30px;
  }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #E6F8ED;
    color: #1BAA5C;
    font-size: 28px;
    line-height: 56px;
    margin: 0 auto 16px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 8px;
  }
  p {
    color: var(--gray);
    margin: 0 0 6px;
    line-height: 1.5;
  }
  #status-note {
    font-size: 0.85rem;
    margin-top: 18px;
    color: var(--gray);
  }
  footer {
    text-align: center;
    color: #B7C1CA;
    font-size: 0.75rem;
    padding: 30px 0;
  }
</style>
</head>
<body>

<header>
  <img src="/assets/logo.png" alt="DigiPagos" />
</header>

<main>
  <div class="card">
    <div class="icon">✓</div>
    <h1>You're all set</h1>
    <p>Thanks — we've received your information.</p>
    <p id="status-note">Some verifications are approved instantly; others may take a little longer to review. We'll notify you as soon as it's confirmed.</p>
  </div>
</main>

<footer>DigiPagos — Fast. Secure. Borderless.</footer>

</body>
</html>
